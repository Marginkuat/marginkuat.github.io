<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg0:#0D0F0A;--bg1:#161A0F;--bg2:#1E2312;--bg3:#2A2410;--border:#2A2E1F}
body.light-theme{--bg0:#F7F5EE;--bg1:#FFFFFF;--bg2:#F0EDE0;--bg3:#FBF1D2;--border:#E3DCC4}
body{font-family:'Inter',sans-serif;background:var(--bg0);color:#D4AF37;min-height:100vh;transition:background .25s ease}
.theme-toggle{width:30px;height:30px;border-radius:20px;border:1.5px solid #B8860B;background:transparent;color:#C8A84B;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg0);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spin{width:32px;height:32px;border:2px solid var(--border);border-top-color:#B8860B;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* HEADER */
.header{padding:20px 16px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column}
.brand-name{font-size:22px;font-weight:800;color:#C8A84B;letter-spacing:.5px;line-height:1.1}
.brand-sub{font-size:10px;color:#9C7A2E;text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-admin{padding:5px 12px;border-radius:20px;border:1.5px solid #B8860B;background:transparent;color:#C8A84B;font-size:10px;font-weight:700;cursor:pointer}
.btn-logout{padding:5px 12px;border-radius:20px;border:1.5px solid #555;background:transparent;color:#9C7A2E;font-size:10px;font-weight:700;cursor:pointer;display:none}

/* SECTION */
.section{padding:20px 16px 0}
.sec-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#C8A84B;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}

/* BALANCE HERO */
.balance-card{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:20px;margin:16px;margin-bottom:0;text-align:center}
.bal-label{font-size:10px;color:#9C7A2E;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.bal-cent{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;color:#C8A84B;letter-spacing:-1px}
.bal-usd{font-size:14px;color:#B8924A;margin-top:4px;font-family:'JetBrains Mono',monospace}
.bal-rp{font-size:12px;color:#7A5D1F;margin-top:2px;font-family:'JetBrains Mono',monospace;margin-bottom:16px}
.bal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bal-box{background:var(--bg2);border-radius:10px;padding:10px 6px;text-align:center}
.bal-box-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.bal-box-lbl{font-size:9px;color:#8A6B26;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.cg{color:#4ADE80}.cr{color:#F87171}.cy{color:#C8A84B}

/* KALENDER */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{width:34px;height:34px;background:var(--bg1);border:1px solid var(--border);border-radius:8px;color:#C8A84B;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-month{font-size:16px;font-weight:700;color:#C8A84B}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.cal-day-lbl{text-align:center;font-size:9px;color:#7A5D1F;font-weight:600;padding:4px 0;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{border-radius:8px;padding:4px 2px;text-align:center;min-height:44px;display:flex;flex-direction:column;justify-content:center;background:var(--bg1);border:1px solid var(--bg2)}
.cal-cell.profit{background:#132D0E;border-color:#1E4A14}
.cal-cell.loss{background:#2D0E0E;border-color:#4A1414}
.cal-cell.today{border-color:#C8A84B;border-width:1.5px}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-num{font-size:11px;font-weight:700;color:#D4AF37}
.cal-amt{font-size:8px;font-weight:700;margin-top:1px}
.cal-legend{display:flex;justify-content:center;gap:14px;margin-top:8px}
.cal-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#8A6B26}
.cal-leg-dot{width:8px;height:8px;border-radius:3px}

/* GRAFIK BULANAN */
.graph-card{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:16px}
.kamus-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.kamus-item summary{font-size:11px;font-weight:700;color:#D4AF37;cursor:pointer;list-style:none}
.kamus-item summary::-webkit-details-marker{display:none}
.kamus-item summary::before{content:'▸ ';color:#8A6B26}
.kamus-item[open] summary::before{content:'▾ '}
.kamus-item .kamus-body{font-size:10px;color:#8A6B26;line-height:1.7;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.graph-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.graph-month{font-size:15px;font-weight:700;color:#D4AF37}
.graph-signal{font-size:10px;color:#8A6B26;margin-top:2px}
.graph-total{text-align:center;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;margin-bottom:2px}
.graph-pct{text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;margin-bottom:12px}
.graph-tooltip{position:absolute;top:6px;background:var(--bg0);border:1px solid var(--border);border-radius:9px;padding:7px 11px;pointer-events:none;display:none;white-space:nowrap;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.graph-tooltip-date{font-size:10px;color:#9C7A2E;font-weight:700;margin-bottom:2px}
.graph-tooltip-val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700}
.graph-dashed{stroke:#5C4818;stroke-width:1;stroke-dasharray:3,3}
.graph-dot-outer{fill:none;stroke-width:2}
.graph-dot-inner{stroke:none}

/* TARGET */
.target-card{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:16px}
.target-title{text-align:center;font-size:13px;font-weight:700;color:#D4AF37;margin-bottom:4px}
.target-sub{text-align:center;font-size:11px;color:#8A6B26;margin-bottom:12px}
.target-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.target-box{background:var(--bg2);border-radius:10px;padding:10px;text-align:center}
.target-box-lbl{font-size:9px;color:#8A6B26;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.target-box-val{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#C8A84B}
.target-arrow{font-size:18px;color:#7A5D1F;text-align:center}
.target-main{background:var(--border);border-radius:10px;padding:10px;text-align:center}
.target-main-lbl{font-size:9px;color:#C8A84B;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.target-main-val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:#FFD700}
.progress-bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#2E4A1E,#4ADE80);transition:width 1s}
.progress-info{display:flex;justify-content:space-between;font-size:10px;color:#8A6B26;margin-top:4px}

/* RIWAYAT */
.riwayat-item{background:var(--bg1);border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.ri-info{flex:1}
.ri-date{font-size:11px;font-weight:700;color:#C8A84B}
.ri-saldo{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#D4AF37}
.ri-profit{font-size:10px;font-weight:600}
.ri-cat{font-size:10px;color:#7A5D1F}

/* PROFIT BULANAN */
.pb-item{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.pb-bulan{font-size:14px;font-weight:700;color:#D4AF37}
.pb-signal{font-size:11px;color:#7A5D1F;margin-top:2px}
.pb-profit{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;text-align:right}

/* PAIR TABS */
.pair-tab{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg0);color:#8A6B26;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.pair-tab.active{border-color:#B8860B;background:var(--bg3);color:#D4AF37}
.zoom-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg0);color:#C8A84B;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.progress-track{width:100%;height:14px;border-radius:8px;background:var(--bg0);border:1px solid var(--border);overflow:hidden}
.progress-fill{height:100%;border-radius:8px;transition:width .4s ease}
.mood-btn{padding:10px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg0);color:#8A6B26;font-size:20px;cursor:pointer;text-align:center;line-height:1.3}
.mood-btn.active{border-color:#B8860B;background:var(--bg3)}

/* ADMIN PANEL */
.admin-panel{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:16px;display:none}
.ap-title{font-size:12px;font-weight:700;color:#C8A84B;margin-bottom:12px}
.lbl{font-size:10px;font-weight:600;color:#8A6B26;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:'Inter',sans-serif;background:var(--bg0);color:#D4AF37;outline:none;margin-bottom:10px}
.inp:focus{border-color:#B8860B}
.inp::placeholder{color:#5C4818}
.btn{width:100%;padding:11px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px}
.btn-p{background:linear-gradient(135deg,#B8860B,#C8A84B);color:var(--bg0)}
.btn-g{background:#132D0E;color:#4ADE80;border:1px solid #1E4A14}
.btn-ghost{background:var(--bg2);color:#9C7A2E}
.preview-box{background:var(--bg0);border-radius:9px;padding:10px;margin-bottom:10px;display:none}
.preview-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.pv-lbl{font-size:9px;color:#7A5D1F;margin-bottom:2px}
.pv-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:var(--bg1);border:1px solid var(--border);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow-y:auto}
.modal-bar{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
